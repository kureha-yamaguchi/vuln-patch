[project]
name = "vuln-patch"
version = "0.1.0"
description = "Pipeline for automatically generating fuzzing harnesses for sibling bugs to ensure that the patch fixes the root cause of the vulnerability. Our goal is to reduce semantically incorrect patches through automated variant analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "javalang",
]

[project.optional-dependencies]
# fuzz-introspector pulls in atheris which requires a non-Apple Clang with
# libFuzzer. Install this group only on Linux or with a custom Clang build:
#   uv sync --extra introspector
introspector = [
    "fuzz-introspector>=0.1.10",
]
