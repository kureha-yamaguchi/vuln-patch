[project]
name = "vuln-patch"
version = "0.1.0"
description = "Pipeline for automatically generating fuzzing harnesses for sibling bugs to ensure that the patch fixes the root cause of the vulnerability. Our goal is to reduce semantically incorrect patches through automated variant analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "javalang",
]

[project.optional-dependencies]
# fuzz-introspector pulls in atheris which requires a non-Apple Clang with
# libFuzzer. Install this group only on Linux or with a custom Clang build:
#   uv sync --extra introspector
introspector = [
    "fuzz-introspector>=0.1.10",
]

[tool.pytest.ini_options]
# Cycle-7: pin what bare `pytest` collects, and settle a recurring phantom.
#
# A stable 8-test gap was read three times as a cross-machine discrepancy. It was
# never an environment difference — it is invocation scope. Bare `pytest`
# collects 503; `pytest tests/` collects 495; the 8 are
# src/oss_fuzz/tests/test_offline.py, which lives outside tests/ and so is only
# picked up when no path argument is given. 495 + 8 = 503.
#
# NOTE: an explicit path argument OVERRIDES testpaths (pytest's documented
# behaviour), so `pytest tests/` still collects 495 and that is correct — it is a
# deliberate narrowing, not a discrepancy.
#
# CONVENTION: report test counts from bare `pytest`, which is now pinned to both
# roots. A count that differs from bare `pytest` on another machine is then a
# real difference worth investigating, not this.
testpaths = ["tests", "src/oss_fuzz/tests"]
